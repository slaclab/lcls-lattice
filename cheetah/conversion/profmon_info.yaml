# Profile monitor (screen) camera parameters, keyed by MAD element name.
#
# Schema matches virtual-accelerator's
# `virtual_accelerator/utils/cu_hxr_profmon_info.yaml`, so that repo can point
# at this file instead of carrying its own copy:
#
#   <ELEMENT>:
#      name: <control system name>   # matched against metadata.alias
#      shape: [n_rows, n_cols]       # -> cheetah Screen.resolution
#      pixel_size: <microns>         # -> cheetah Screen.pixel_size, x 1e-6
#
# Consumed by `rename_screens_and_bpms.py`. Screens absent from this file fall
# back to a 1024 x 1024 @ 10 um placeholder (a 10.24 mm field of view) and are
# reported as a warning by that script.
#
# The nine entries below were copied from virtual-accelerator. Do not source
# these from the deleted cheetah/nc_hxr.json (see commit 2eb81e5^) -- the values
# there were hand-entered with inconsistent axis order.

