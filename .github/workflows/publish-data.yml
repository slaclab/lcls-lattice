name: publish-data

on:
  push:
    branches:
      - export_lattice_script

jobs:
  build:
    if: ${{ github.repository == 'slaclab/lcls-lattice' }}
    runs-on: ubuntu-latest
    name: Publish lattice to lcls-lattice-data
    steps:
      - uses: actions/checkout@v2
      - uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,anaconda
          channel-priority: flexible
      - name: Run lattice export
        shell: bash -l {0}
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda install -c conda-forge pytao bmad
          python export_lattice.py --source $(pwd) --dest /tmp/lattice-data
      - name: Push directory to another repository
        uses: cpina/github-action-push-to-another-repository@v1.4.1
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: /tmp/lattice-data
          destination-github-username: slaclab
          destination-repository-name: lcls-lattice-data
          user-email: ${{ secrets.USER_EMAIL }}
          target-branch: main

